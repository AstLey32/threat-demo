<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银针情报平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --danger-color: #e74c3c;
            --dark-color: #2c3e50;
            --light-color: #ecf0f1;
            --gray-color: #95a5a6;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: var(--dark-color);
            color: white;
            padding: 20px 0;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        .logo i {
            margin-right: 10px;
            color: var(--primary-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        .sidebar {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            height: fit-content;
        }

        .sidebar-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--dark-color);
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        .sidebar-title i {
            margin-right: 10px;
            color: var(--primary-color);
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--dark-color);
        }

        .search-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            font-size: 14px;
        }

        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-option {
            display: flex;
            align-items: center;
        }

        .filter-option input {
            margin-right: 8px;
        }

        .filter-option label {
            font-size: 14px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn i {
            margin-right: 5px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #27ae60;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .btn-block {
            width: 100%;
        }

        .main-content {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .content-title {
            font-size: 20px;
            color: var(--dark-color);
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .intel-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .intel-card {
            border: 1px solid #eee;
            border-radius: var(--border-radius);
            padding: 15px;
            transition: all 0.3s;
        }

        .intel-card:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .intel-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .intel-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--dark-color);
        }

        .intel-source {
            font-size: 14px;
            color: var(--gray-color);
            display: flex;
            align-items: center;
        }

        .intel-source i {
            margin-right: 5px;
        }

        .intel-category {
            display: inline-block;
            padding: 3px 8px;
            background-color: var(--light-color);
            border-radius: 12px;
            font-size: 12px;
            color: var(--dark-color);
            margin-left: 10px;
        }

        .intel-description {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .intel-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--gray-color);
        }

        .intel-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .intel-link:hover {
            text-decoration: underline;
        }

        .intel-score {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            background-color: #3d13aa;
            color: #fff;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 5px;
        }

        .page-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background-color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .page-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--gray-color);
        }

        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            color: #ddd;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            border-radius: var(--border-radius);
            width: 500px;
            max-width: 90%;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--gray-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 14px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--dark-color);
            color: white;
            padding: 15px 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            z-index: 1001;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            margin-right: 10px;
            font-size: 20px;
        }

        .toast.success i {
            color: var(--secondary-color);
        }

        .toast.error i {
            color: var(--danger-color);
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .content-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .action-buttons {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <span>银针情报平台</span>
            </div>
            <div class="nav-links">
                <a href="#"><i class="fas fa-home"></i> 首页</a>
                <a href="#"><i class="fas fa-cog"></i> 设置</a>
                <a href="#"><i class="fas fa-question-circle"></i> 帮助</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="dashboard">
            <div class="sidebar">
                <div class="sidebar-title">
                    <i class="fas fa-filter"></i>
                    <span>筛选条件</span>
                </div>
                <div class="filter-group">
                    <input type="text" id="search-input" class="search-input" placeholder="搜索标题或描述...">
                </div>
                <button id="apply-filters" class="btn btn-primary btn-block">
                    <i class="fas fa-check"></i> 应用筛选
                </button>
                <button id="reset-filters" class="btn btn-block" style="margin-top: 10px;">
                    <i class="fas fa-undo"></i> 重置
                </button>
                <div class="filter-group">
                    <h3>分类</h3>
                    <div class="filter-options" id="category-filters">
                        <!-- 动态生成分类选项 -->
                    </div>
                </div>
                <div class="filter-group">
                    <h3>数据源</h3>
                    <div class="filter-options" id="source-filters">
                        <!-- 动态生成数据源选项 -->
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="content-header">
                    <div class="content-title">
                        <i class="fas fa-list"></i>
                        <span>威胁情报列表</span>
                    </div>
                    <div class="action-buttons">
                        <button id="refresh-data" class="btn btn-secondary">
                            <i class="fas fa-sync-alt"></i> 刷新数据
                        </button>
                        <button id="start-crawl" class="btn btn-primary">
                            <i class="fas fa-spider"></i> 启动爬虫
                        </button>
                    </div>
                </div>

                <div id="intel-list" class="intel-list">
                    <!-- 动态生成情报列表 -->
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>

                <div class="pagination" id="pagination">
                    <!-- 动态生成分页 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 启动爬虫确认模态框 -->
    <div class="modal" id="crawl-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fas fa-spider"></i> 启动爬虫
                </div>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p>确定要启动爬虫收集最新威胁情报吗？此操作可能需要一些时间。</p>
            </div>
            <div class="modal-footer">
                <button id="cancel-crawl" class="btn">取消</button>
                <button id="confirm-crawl" class="btn btn-primary">确认</button>
            </div>
        </div>
    </div>

    <!-- 通知提示 -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">操作成功</span>
    </div>

    <script>
        let API_BASE_URL = 'http://127.0.0.1:28358';
        let currentPage = 1;
        const itemsPerPage = 10;
        let totalItems = 0;
        let allSources = [];
        let allCategories = [];
        let currentFilters = {
            title: '',
            source: '',
            category: '',
            limit: itemsPerPage,
            offset: 0
        };

        // DOM元素
        const intelList = document.getElementById('intel-list');
        const pagination = document.getElementById('pagination');
        const searchInput = document.getElementById('search-input');
        const sourceFilters = document.getElementById('source-filters');
        const categoryFilters = document.getElementById('category-filters');
        const applyFiltersBtn = document.getElementById('apply-filters');
        const resetFiltersBtn = document.getElementById('reset-filters');
        const refreshDataBtn = document.getElementById('refresh-data');
        const startCrawlBtn = document.getElementById('start-crawl');
        const crawlModal = document.getElementById('crawl-modal');
        const cancelCrawlBtn = document.getElementById('cancel-crawl');
        const confirmCrawlBtn = document.getElementById('confirm-crawl');
        const closeModalBtn = document.querySelector('.close-btn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            fetchDataSources();
            fetchThreatIntel();
            fetchTotalCount();
        });

        // 事件监听器
        applyFiltersBtn.addEventListener('click', applyFilters);
        resetFiltersBtn.addEventListener('click', resetFilters);
        refreshDataBtn.addEventListener('click', refreshData);
        startCrawlBtn.addEventListener('click', showCrawlModal);
        cancelCrawlBtn.addEventListener('click', hideCrawlModal);
        confirmCrawlBtn.addEventListener('click', startCrawl);
        closeModalBtn.addEventListener('click', hideCrawlModal);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                applyFilters();
            }
        });

        // 点击模态框外部关闭
        window.addEventListener('click', (e) => {
            if (e.target === crawlModal) {
                hideCrawlModal();
            }
        });

        // 获取数据源
        async function fetchDataSources() {
            try {
                const response = await fetch(`${API_BASE_URL}/sources`);
                if (!response.ok) throw new Error('获取数据源失败');
                
                allSources = await response.json();
                renderSourceFilters();
                
                // 提取所有分类
                const categories = new Set();
                allSources.forEach(source => {
                    if (source.category) {
                        categories.add(source.category);
                    }
                });
                allCategories = Array.from(categories);
                renderCategoryFilters();
                
            } catch (error) {
                showToast(error.message, 'error');
                     }
        }

        // 渲染数据源筛选器
        function renderSourceFilters() {
            sourceFilters.innerHTML = '';
            allSources.forEach(source => {
                const option = document.createElement('div');
                option.className = 'filter-option';
                option.innerHTML = `
                    <input type="checkbox" id="source-${source.id}" value="${source.url}" data-source="${source.poster}">
                    <label for="source-${source.id}">${source.poster}</label>
                `;
                sourceFilters.appendChild(option);
            });
        }

        // 渲染分类筛选器
        function renderCategoryFilters() {
            categoryFilters.innerHTML = '';
            allCategories.forEach(category => {
                const option = document.createElement('div');
                option.className = 'filter-option';
                option.innerHTML = `
                    <input type="checkbox" id="category-${category}" value="${category}">
                    <label for="category-${category}">${category}</label>
                `;
                categoryFilters.appendChild(option);
            });
        }

        // 获取总数
        async function fetchTotalCount() {
            try {
                const params = {
                    title: currentFilters.title || undefined,
                    source: currentFilters.source || undefined,
                    category: currentFilters.category || undefined
                };
                
                // 移除未定义的参数
                Object.keys(params).forEach(key => params[key] === undefined && delete params[key]);
                
                const queryParams = new URLSearchParams(params);
                
                const response = await fetch(`${API_BASE_URL}/query_count?${queryParams}`);
                if (!response.ok) throw new Error('获取总数失败');
                
                totalItems = await response.json();
                renderPagination();
                
            } catch (error) {
                console.error('获取总数失败:', error);
            }
        }
        
        // 获取威胁情报
        async function fetchThreatIntel() {
            intelList.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            `;
            
            try {
                const params = {
                    title: currentFilters.title || undefined,
                    source: currentFilters.source || undefined,
                    category: currentFilters.category || undefined,
                    limit: currentFilters.limit,
                    offset: (currentPage - 1) * itemsPerPage
                };
                
                // 移除未定义的参数
                Object.keys(params).forEach(key => params[key] === undefined && delete params[key]);
                
                const queryParams = new URLSearchParams(params);
                
                const response = await fetch(`${API_BASE_URL}/query_items?${queryParams}`);
                if (!response.ok) throw new Error('获取威胁情报失败');
                
                const data = await response.json();
                renderIntelList(data);
                
                // 如果总数未获取，则获取总数
                if (totalItems === 0) {
                    await fetchTotalCount();
                }
                
            } catch (error) {
                intelList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>${error.message}</p>
                    </div>
                `;
                showToast(error.message, 'error');
            }
        }

        // 添加HTML转义函数
        function escapeHtml(unsafe) {
            if (!unsafe) return unsafe;
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 渲染情报列表
        function renderIntelList(data) {
            if (data.length === 0) {
                intelList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>没有找到匹配的情报</p>
                    </div>
                `;
                return;
            }
            
            intelList.innerHTML = '';
            data.forEach(item => {
                // 使用翻译后的标题和描述（如果存在）
                const title = escapeHtml(item.translated_title || item.title);
                const description = escapeHtml(item.titlecn || item.description || '暂无描述');
                
                const card = document.createElement('div');
                card.className = 'intel-card';
                card.innerHTML = `
                    <div class="intel-header">
                        <div class="intel-title">${title}</div>
                        <div class="intel-source">
                            <i class="fas fa-database"></i>
                            ${item.poster}
                            ${item.category ? `<span class="intel-category">${item.category}</span>` : ''}
                        </div>
                    </div>
                    <div class="intel-description">
                        ${description}
                        ${item.comment ? `<div style="margin-top: 8px;"><i class="far fa-comment"></i> <strong>AI评注:</strong> ${item.comment}</div>` : ''}
                    </div>
                    <div class="intel-footer">
                        <div>
                            ${item.publish_time ? `<span><i class="far fa-clock"></i> ${item.publish_time}</span>` : ''}
                        </div>
                        <div>
                            ${item.mark ? `<span class="intel-score">评分: ${item.mark}</span>` : ''}
                            <a href="${item.link}" target="_blank" class="intel-link">
                                <i class="fas fa-external-link-alt"></i> 查看详情
                            </a>
                        </div>
                    </div>
                `;
                intelList.appendChild(card);
            });
        }


        // 渲染分页
        function renderPagination() {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            pagination.innerHTML = '';
            
            // 上一页按钮
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevBtn.disabled = currentPage === 1;
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchThreatIntel();
                    renderPagination();
                }
            });
            pagination.appendChild(prevBtn);
            
            // 页码按钮
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
            
            // 调整起始页码，确保显示足够的页码
            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }
            
            // 第一页
            if (startPage > 1) {
                const firstPageBtn = document.createElement('button');
                firstPageBtn.className = 'page-btn';
                firstPageBtn.textContent = '1';
                firstPageBtn.addEventListener('click', () => {
                    currentPage = 1;
                    fetchThreatIntel();
                    renderPagination();
                });
                pagination.appendChild(firstPageBtn);
                
                if (startPage > 2) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'page-ellipsis';
                    ellipsis.textContent = '...';
                    pagination.appendChild(ellipsis);
                }
            }
            
            // 中间页码
            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.textContent = i;
                pageBtn.addEventListener('click', () => {
                    currentPage = i;
                    fetchThreatIntel();
                    renderPagination();
                });
                pagination.appendChild(pageBtn);
            }
            
            // 最后一页
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'page-ellipsis';
                    ellipsis.textContent = '...';
                    pagination.appendChild(ellipsis);
                }
                
                const lastPageBtn = document.createElement('button');
                lastPageBtn.className = 'page-btn';
                lastPageBtn.textContent = totalPages;
                lastPageBtn.addEventListener('click', () => {
                    currentPage = totalPages;
                    fetchThreatIntel();
                    renderPagination();
                });
                pagination.appendChild(lastPageBtn);
            }
            
            // 下一页按钮
            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchThreatIntel();
                    renderPagination();
                }
            });
            pagination.appendChild(nextBtn);
        }

        // 应用筛选条件
        function applyFilters() {
            currentPage = 1;
            currentFilters.title = searchInput.value.trim();
            
            // 获取选中的数据源
            const selectedSources = [];
            document.querySelectorAll('#source-filters input:checked').forEach(input => {
                selectedSources.push(input.dataset.source);
            });
            currentFilters.source = selectedSources.join(',');
            
            // 获取选中的分类
            const selectedCategories = [];
            document.querySelectorAll('#category-filters input:checked').forEach(input => {
                selectedCategories.push(input.value);
            });
            currentFilters.category = selectedCategories.join(',');
            
            // 重置总数并重新获取
            totalItems = 0;
            fetchThreatIntel();
            fetchTotalCount();
        }

        // 重置筛选条件
        function resetFilters() {
            currentPage = 1;
            currentFilters = {
                title: '',
                source: '',
                category: '',
                limit: itemsPerPage,
                offset: 0
            };
            
            searchInput.value = '';
            document.querySelectorAll('#source-filters input').forEach(input => {
                input.checked = false;
            });
            document.querySelectorAll('#category-filters input').forEach(input => {
                input.checked = false;
            });
            
            // 重置总数并重新获取
            totalItems = 0;
            fetchThreatIntel();
            fetchTotalCount();
        }

        // 刷新数据
        function refreshData() {
            fetchThreatIntel();
            showToast('数据已刷新', 'success');
        }

        // 显示爬虫模态框
        function showCrawlModal() {
            crawlModal.style.display = 'flex';
        }

        // 隐藏爬虫模态框
        function hideCrawlModal() {
            crawlModal.style.display = 'none';
        }

        // 启动爬虫
        async function startCrawl() {
            hideCrawlModal();
            showToast('爬虫正在运行，请稍候...', 'info');
            
            try {
                const response = await fetch(`${API_BASE_URL}/ins`, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '启动爬虫失败');
                }
                
                const result = await response.json();
                showToast(`爬虫完成，新增 ${result.new_records || 0} 条记录`, 'success');
                fetchThreatIntel();
                
            } catch (error) {
                showToast(error.message, 'error');
            }
        }


        // 显示通知
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            toast.className = `toast ${type}`;
            
            const icon = toast.querySelector('i');
            icon.className = type === 'success' ? 'fas fa-check-circle' :
                             type === 'error' ? 'fas fa-exclamation-circle' :
                             'fas fa-info-circle';
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
